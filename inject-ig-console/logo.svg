<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="20" y1="30" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
  <!-- Glow effect -->
  <text x="60" y="82" text-anchor="middle" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="800" font-size="62" fill="rgba(59,130,246,0.15)" filter="url(#glow)" letter-spacing="-2">IG</text>
  <!-- Main text -->
  <text x="60" y="82" text-anchor="middle" font-family="'Inter','Helvetica Neue',sans-serif" font-weight="800" font-size="62" fill="url(#text-grad)" letter-spacing="-2">IG</text>
  <!-- Subtle accent line -->
  <rect x="30" y="95" width="60" height="2" rx="1" fill="rgba(59,130,246,0.25)"/>
</svg>
