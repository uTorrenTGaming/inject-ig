<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inject-ig — Iniciando</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #07080d;
            --surface: rgba(255,255,255,0.04);
            --accent: #3b82f6;
            --accent-glow: rgba(59,130,246,0.25);
            --text-1: #e8eaed;
            --text-2: #6b7280;
            --green: #22c55e;
            --amber: #f59e0b;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            -webkit-app-region: drag;
            user-select: none;
            overflow: hidden;
        }

        /* Animated background orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 250px; height: 250px; background: #8b5cf6; bottom: -80px; right: -80px; animation-delay: 3s; }
        .orb-3 { width: 200px; height: 200px; background: #06b6d4; top: 50%; right: -60px; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .container {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Logo area */
        .logo-wrap {
            margin-bottom: 40px;
            position: relative;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo-ring {
            width: 90px; height: 90px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
            border: 1px solid rgba(59,130,246,0.3);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 40px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: conic-gradient(from 0deg, transparent 70%, var(--accent) 100%);
            animation: spin 2s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -1px;
        }

        /* App name */
        .app-name {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-1);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            animation: fadeUp 0.5s ease 0.3s both;
        }

        .app-version {
            font-size: 12px;
            color: var(--text-2);
            margin-bottom: 50px;
            animation: fadeUp 0.5s ease 0.4s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Status area */
        .status-wrap {
            width: 280px;
            animation: fadeUp 0.5s ease 0.5s both;
        }

        .status-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .status-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #8b5cf6);
            border-radius: 99px;
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(59,130,246,0.6);
        }

        .status-text {
            font-size: 12px;
            color: var(--text-2);
            text-align: center;
            min-height: 18px;
            transition: opacity 0.3s;
        }

        .status-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 6px;
            animation: pulse 1.5s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Steps log */
        .steps-log {
            margin-top: 30px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeUp 0.5s ease 0.6s both;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-2);
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.4s, transform 0.4s;
        }

        .step-item.active {
            color: var(--text-1);
            opacity: 1;
            transform: translateX(0);
        }

        .step-item.done {
            color: var(--green);
            opacity: 1;
            transform: translateX(0);
        }

        .step-icon {
            width: 16px; height: 16px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px;
            flex-shrink: 0;
        }

        .step-item.active .step-icon {
            background: rgba(59,130,246,0.2);
            border: 1px solid rgba(59,130,246,0.4);
            animation: pulse 1s ease-in-out infinite;
        }

        .step-item.done .step-icon {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: var(--green);
        }

        .step-item.pending .step-icon {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Bottom branding */
        .footer {
            position: absolute;
            bottom: 24px;
            font-size: 10px;
            color: rgba(255,255,255,0.15);
            animation: fadeUp 0.5s ease 1s both;
        }
    </style>
</head>
<body>

    <!-- Animated background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-ring">
                <span class="logo-text">IG</span>
            </div>
        </div>

        <!-- Name -->
        <div class="app-name">inject-ig</div>
        <div class="app-version">Console v2.0 — Iniciando Sistema</div>

        <!-- Progress bar -->
        <div class="status-wrap">
            <div class="status-bar-bg">
                <div class="status-bar-fill" id="progress-fill"></div>
            </div>
            <div class="status-text" id="status-text">
                <span class="status-dot"></span>Preparando ambiente...
            </div>
        </div>

        <!-- Step log -->
        <div class="steps-log" id="steps-log">
            <div class="step-item pending" id="step-java">
                <div class="step-icon">○</div>
                <span>Verificando Java Runtime</span>
            </div>
            <div class="step-item pending" id="step-server">
                <div class="step-icon">○</div>
                <span>Iniciando servidor interno</span>
            </div>
            <div class="step-item pending" id="step-api">
                <div class="step-icon">○</div>
                <span>Aguardando API na porta 8080</span>
            </div>
            <div class="step-item pending" id="step-ready">
                <div class="step-icon">○</div>
                <span>Carregando interface</span>
            </div>
        </div>

    </div>

    <div class="footer">inject-ig — Sistema de Vigilância Digital</div>

    <script>
        // Splash screen controlled by IPC from main.js
        if (window.splashAPI) {
            window.splashAPI.onProgress((data) => {
                updateProgress(data.step, data.progress, data.message);
            });
        }

        function updateProgress(step, progress, message) {
            const fill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');

            fill.style.width = progress + '%';

            if (message) {
                statusText.innerHTML = `<span class="status-dot"></span>${message}`;
            }

            const steps = ['step-java', 'step-server', 'step-api', 'step-ready'];
            steps.forEach((id, i) => {
                const el = document.getElementById(id);
                if (i < step) {
                    el.className = 'step-item done';
                    el.querySelector('.step-icon').innerHTML = '✓';
                } else if (i === step) {
                    el.className = 'step-item active';
                    el.querySelector('.step-icon').innerHTML = '●';
                } else {
                    el.className = 'step-item pending';
                    el.querySelector('.step-icon').innerHTML = '○';
                }
            });
        }

        // Demo animation (used when called without IPC, for visual testing)
        let demoStep = 0;
        const demoSteps = [
            { step: 0, progress: 15, message: 'Verificando Java Runtime...' },
            { step: 1, progress: 40, message: 'Iniciando servidor interno...' },
            { step: 2, progress: 70, message: 'Aguardando API na porta 8080...' },
            { step: 3, progress: 95, message: 'Carregando interface...' },
        ];

        if (!window.splashAPI) {
            // No IPC — run demo mode
            const runDemo = () => {
                if (demoStep < demoSteps.length) {
                    const d = demoSteps[demoStep++];
                    updateProgress(d.step, d.progress, d.message);
                    setTimeout(runDemo, 1200);
                }
            };
            setTimeout(runDemo, 600);
        }
    </script>
</body>
</html>
