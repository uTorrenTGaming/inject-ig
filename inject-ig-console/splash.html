<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:* https://*.supabase.co https://api.xposedornot.com https://ipapi.co https://api.open-meteo.com;">
    <title>inject-ig — Iniciando</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        :root {
            --bg: #000000;
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.7);
            --track-bg: rgba(255, 255, 255, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            /* Apple-style typography */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-app-region: drag;
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Ambient lights removed to keep pure OLED black */

        .container {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        /* Clean Logo area with Liquid Glass */
        .logo-wrap {
            margin-bottom: 24px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo-box {
            width: 80px; height: 80px;
            border-radius: 20px; /* Squircle appearance */
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        /* App Typography */
        .app-name {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
            animation: fadeIn 0.8s ease 0.1s both;
        }

        .app-welcome {
            height: 60px;
            margin-top: -5px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 20;
        }

        .welcome-text {
            position: absolute;
            font-family: 'Dancing Script', cursive;
            font-size: 48px;
            font-weight: 700;
            
            /* Ultra-realistic Transparent Glass Effect */
            color: transparent;
            -webkit-text-stroke: 1.2px rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(100,200,255,0.1) 40%, rgba(0,255,255,0.3) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.3)) drop-shadow(0px 0px 12px rgba(0, 255, 255, 0.2));

            opacity: 0;
            transform: scale(0.9) translateY(5px);
            transition: opacity 1.2s cubic-bezier(0.25, 0.1, 0.25, 1), transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .welcome-text.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Subtle Progress Area */
        .status-wrap {
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease 0.3s both;
        }

        .status-bar-bg {
            width: 100%;
            height: 4px;
            background: var(--track-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .status-bar-fill {
            height: 100%;
            background: #FFFFFF;
            border-radius: 4px;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
            min-height: 16px;
            letter-spacing: 0.2px;
        }

        /* ═══════════ iPHONE 3D MODE ═══════════ */
        body.iphone-3d-mode {
            background: transparent !important;
            perspective: 2000px;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }
        body.iphone-3d-mode .app {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 430px !important;
            height: 932px !important;
            flex: none;
            border-radius: 55px; /* Pro Max rounded corners */
            border: 12px solid #000; /* Inner bezel */
            box-shadow: 
                0 0 0 2px #555, 
                0 0 0 6px #2a2a2c, 
                0 0 0 7px #111, 
                0 40px 80px rgba(0,0,0,0.8), 
                -20px -20px 60px rgba(255,255,255,0.05); 
            transform: translate(-50%, -50%) scale(0.72);
            transform-origin: center center;
            -webkit-app-region: drag;
            position: relative;
            background: #050505; /* Fundo sólido de tela de iPhone */
            overflow: hidden;
            transform-style: preserve-3d;
        }
        body.iphone-3d-mode .logo-wrap,
        body.iphone-3d-mode .status-wrap {
            -webkit-app-region: no-drag;
        }
        /* Dynamic Island */
        body.iphone-3d-mode .app::before {
            content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 125px; height: 37px; background: #000; border-radius: 24px; z-index: 999999;
            box-shadow: inset 0 -1px 2px rgba(255,255,255,0.15), 0 2px 10px rgba(0,0,0,0.5); pointer-events: none;
        }
        /* Camera Lens */
        body.iphone-3d-mode .app::after {
            content: ''; position: absolute; top: 24px; left: calc(50% + 42px);
            width: 12px; height: 12px; border-radius: 50%;
            background: radial-gradient(circle at 3px 3px, #1a1a1a 0%, #000 100%);
            box-shadow: inset 0 0 2px rgba(255,255,255,0.3); z-index: 9999999; pointer-events: none;
        }
    </style>
</head>
<body class="iphone-3d-mode">
    <div class="app">

    <div class="container">
        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-box">
                <svg class="logo-svg" width="46" height="46" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Clean, rounded Apple-style typography for "IG" with glowing drop shadow -->
                    <g filter="drop-shadow(0px 2px 8px rgba(255,255,255,0.4))">
                        <rect x="16" y="20" width="14" height="60" rx="7" fill="#FFFFFF"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M86 54C86 50.686 83.314 48 80 48H64C60.686 48 58 45.314 58 42C58 38.686 60.686 36 64 36H78.36C75.24 28.5 68.22 23 60 23C48.4 23 39 32.4 39 44V56C39 67.6 48.4 77 60 77C68.95 77 76.58 71.3 79.2 63H64C60.686 63 58 60.314 58 57C58 53.686 60.686 51 64 51H80C83.314 51 86 53.686 86 57V63C86 78.46 74.46 91 60 91C41.77 91 27 76.23 27 58V42C27 23.77 41.77 9 60 9C73.86 9 85.74 17.55 89.6 30.2C90.6 33.5 88.8 37 85.5 38C82.2 39 78.7 37.2 77.7 33.9C74.6 24.8 68 18.5 60 18.5C46.47 18.5 35.5 29.47 35.5 43V57C35.5 70.53 46.47 81.5 60 81.5C69.45 81.5 77.6 76.1 81.5 68H64C64 68 64 68 64 68H80C84.418 68 88 64.418 88 60V54H86Z" fill="#FFFFFF"/>
                        <path d="M80 48H64C59.58 48 56 44.42 56 40C56 35.58 59.58 32 64 32H79C81.76 32 84 34.24 84 37V44C84 46.21 82.21 48 80 48Z" fill="#FFFFFF"/>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Name -->
        <div class="app-name">inject-ig</div>
        <div class="app-welcome">
            <span class="welcome-text active" id="welcome-target">Bem-vindo</span>
        </div>

        <!-- Progress bar -->
        <div class="status-wrap">
            <div class="status-bar-bg">
                <div class="status-bar-fill" id="progress-fill"></div>
            </div>
            <div class="status-text" id="status-text">
                Preparando ambiente...
            </div>
        </div>
    </div>

    <script>
        // Splash screen controlled by IPC from main.js
        if (window.splashAPI) {
            window.splashAPI.onProgress((data) => {
                updateProgress(data.step, data.progress, data.message);
            });
        }

        function updateProgress(step, progress, message) {
            const fill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');

            fill.style.width = progress + '%';

            if (message) {
                // Remove the "(Pode demorar 5-10s)..." from strings if you want it cleaner,
                // but we will just pass it directly for now.
                statusText.innerText = message;
            }
        }

        // iOS-style Welcome Animation
        const greetings = ['olá', 'hello', 'hola', 'bonjour', 'ciao', 'hallo', 'bem-vindo'];
        let greetIndex = 0;
        const welcomeEl = document.getElementById('welcome-target');

        setInterval(() => {
            // Fade out
            welcomeEl.classList.remove('active');
            
            setTimeout(() => {
                // Change text while invisible
                greetIndex = (greetIndex + 1) % greetings.length;
                welcomeEl.innerText = greetings[greetIndex];
                
                // Fade in
                welcomeEl.classList.add('active');
            }, 1200); // Wait for fade out to complete before changing text
            
        }, 3000); // Show each word for 3 seconds

        // Demo animation (used when called without IPC, for visual testing)
        let demoStep = 0;
        const demoSteps = [
            { step: 0, progress: 15, message: 'Verificando sistema...' },
            { step: 1, progress: 40, message: 'Iniciando serviços...' },
            { step: 2, progress: 70, message: 'Conectando ambiente...' },
            { step: 3, progress: 95, message: 'Carregando interface...' },
            { step: 4, progress: 100, message: 'Pronto' },
        ];

        if (!window.splashAPI) {
            // No IPC — run demo mode
            const runDemo = () => {
                if (demoStep < demoSteps.length) {
                    const d = demoSteps[demoStep++];
                    updateProgress(d.step, d.progress, d.message);
                    setTimeout(runDemo, 1200);
                }
            };
            setTimeout(runDemo, 600);
        }
    </script>
    </div> <!-- .app -->
</body>
</html>
