<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#050505"/>
  
  <!-- Outer glowing rings -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#0a84ff" stroke-width="8" opacity="0.4"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="#30d158" stroke-width="4" stroke-dasharray="20 10" opacity="0.6"/>
  
  <!-- Hexagon shield -->
  <polygon points="512,180 800,346 800,678 512,844 224,678 224,346" fill="url(#hexGradient)" stroke="#0a84ff" stroke-width="12" filter="url(#glow)"/>
  <polygon points="512,210 770,360 770,660 512,810 254,660 254,360" fill="none" stroke="#30d158" stroke-width="6" opacity="0.8"/>

  <!-- "IG" Text -->
  <text x="512" y="620" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="320" fill="#ffffff" text-anchor="middle" letter-spacing="-10" filter="url(#glowText)">IG</text>

  <!-- Decorative technical lines -->
  <line x1="100" y1="512" x2="224" y2="512" stroke="#0a84ff" stroke-width="8" opacity="0.6"/>
  <line x1="800" y1="512" x2="924" y2="512" stroke="#0a84ff" stroke-width="8" opacity="0.6"/>
  <line x1="512" y1="100" x2="512" y2="180" stroke="#0a84ff" stroke-width="8" opacity="0.6"/>
  <line x1="512" y1="844" x2="512" y2="924" stroke="#0a84ff" stroke-width="8" opacity="0.6"/>

  <defs>
    <!-- Gradients -->
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
